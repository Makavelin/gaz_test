<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Users API</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      background: #f7f8fa;
    }
    h1 { font-size: 22px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin-top: 28px; }
    form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    input {
      padding: 8px 10px;
      border: 1px solid #ccd;
      border-radius: 6px;
      font-size: 14px;
      flex: 1;
      min-width: 140px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1e4fd8; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.secondary { background: #6b7280; }
    button.secondary:hover { background: #4b5563; }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eef0f4;
      font-size: 14px;
    }
    th { background: #f1f3f8; }
    tr:last-child td { border-bottom: none; }

    .msg {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .msg.ok  { background: #dcfce7; color: #166534; display: block; }
    .msg.err { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>

  <div class="header-actions">
    <h1>Users API</h1>
    <button class="secondary" id="logout-btn">Выйти</button>
  </div>

  <div id="msg" class="msg"></div>

  <!-- Создание -->
  <h2>Создать пользователя</h2>
  <form id="create-form">
    <input id="create-name"  type="text"  placeholder="Имя"   required>
    <input id="create-email" type="email" placeholder="Email" required>
    <button type="submit">Создать</button>
  </form>

  <!-- Список -->
  <h2>Список пользователей</h2>
  <button class="secondary" id="refresh">Обновить</button>
  <table style="margin-top:12px;">
    <thead>
      <tr><th>ID</th><th>Имя</th><th>Email</th><th style="width:220px;">Действия</th></tr>
    </thead>
    <tbody id="users"></tbody>
  </table>

  <script>
    // --- Проверка авторизации при загрузке ---
    const TOKEN_KEY = "users_api_token";
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
      window.location.href = "/login";
    }

    const API = "/users";
    const msg  = document.getElementById("msg");
    const tbody = document.getElementById("users");

    function showMsg(text, type = "ok") {
      msg.textContent = text;
      msg.className = "msg " + type;
      setTimeout(() => { msg.className = "msg"; }, 3500);
    }

    // --- ОБНОВЛЕННАЯ ФУНКЦИЯ ЗАПРОСА С ТОКЕНОМ ---
    async function request(url, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      // Подставляем токен
      const currentToken = localStorage.getItem(TOKEN_KEY);
      if (currentToken) {
        headers["Authorization"] = "Bearer " + currentToken;
      }

      const res = await fetch(url, { ...options, headers });

      if (res.status === 401) {
        // Если токен протух — выкидываем на логин
        localStorage.removeItem(TOKEN_KEY);
        window.location.href = "/login";
        return;
      }

      if (res.status === 204) return null;

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        const detail = data?.detail
          ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))
          : `HTTP ${res.status}`;
        throw new Error(detail);
      }
      return data;
    }

    async function loadUsers() {
      try {
        const users = await request(API);
        if (!users) return; // если произошел редирект
        renderUsers(users);
      } catch (e) {
        showMsg("Ошибка загрузки: " + e.message, "err");
      }
    }

    function renderUsers(users) {
      if (!users.length) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:#888;">Пусто</td></tr>`;
        return;
      }
      tbody.innerHTML = "";
      for (const u of users) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${u.id}</td>
          <td>${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.email)}</td>
          <td>
            <button class="secondary" data-edit="${u.id}">Изменить</button>
            <button class="danger"    data-del="${u.id}">Удалить</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    // Создание
    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name  = document.getElementById("create-name").value.trim();
      const email = document.getElementById("create-email").value.trim();
      try {
        await request(API, { method: "POST", body: JSON.stringify({ name, email }) });
        e.target.reset();
        showMsg("Пользователь создан", "ok");
        loadUsers();
      } catch (err) {
        showMsg("Ошибка создания: " + err.message, "err");
      }
    });

    // Обновить список
    document.getElementById("refresh").addEventListener("click", loadUsers);

    // Выйти
    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      window.location.href = "/login";
    });

    // Делегирование событий на кнопки Изменить/Удалить
    tbody.addEventListener("click", async (e) => {
      const editId = e.target.dataset.edit;
      const delId  = e.target.dataset.del;

      if (editId) {
        const newName  = prompt("Новое имя:");
        if (newName === null) return;
        const newEmail = prompt("Новый email:");
        if (newEmail === null) return;
        try {
          await request(`${API}/${editId}`, {
            method: "PUT",
            body: JSON.stringify({ name: newName, email: newEmail }),
          });
          showMsg("Пользователь обновлён", "ok");
          loadUsers();
        } catch (err) {
          showMsg("Ошибка обновления: " + err.message, "err");
        }
      }

      if (delId) {
        if (!confirm("Удалить пользователя?")) return;
        try {
          await request(`${API}/${delId}`, { method: "DELETE" });
          showMsg("Пользователь удалён", "ok");
          loadUsers();
        } catch (err) {
          showMsg("Ошибка удаления: " + err.message, "err");
        }
      }
    });

    // Запускаем загрузку
    loadUsers();
  </script>
</body>
</html>
